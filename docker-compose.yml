services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affiliatetrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d affiliatetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/affiliatetrack?sslmode=disable
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  stripe:
    image: stripe/stripe-cli:latest
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        stripe listen \
          --api-key "$$STRIPE_SECRET_KEY" \
          --device-name affiliatetrack-docker \
          --forward-to http://backend:8080/webhook/stripe
    depends_on:
      - backend
    profiles:
      - stripe

volumes:
  postgres_data:
